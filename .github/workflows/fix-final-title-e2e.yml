name: Alinear E2E con título final

on:
  push:
    branches: [feat/final-title-social-links]
    paths:
      - ".github/workflows/fix-final-title-e2e.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/final-title-social-links
      - name: Actualizar expectativa del H1
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-dashboard-e2e.mjs')
          s = p.read_text(encoding='utf-8')
          old = 'if (heading !== "Detecciones de calor") throw new Error(`H1 inesperado en carga inicial: ${heading}`);'
          new = 'if (heading !== "Análisis espacial de detecciones de calor en zonas con potencial uso extractivista") throw new Error(`H1 inesperado en carga inicial: ${heading}`);'
          if s.count(old) != 1:
              raise SystemExit(f'Patrón esperado no único: {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-dashboard-e2e.mjs
          git commit -m "test: alinear E2E con título final"
          git push origin HEAD:feat/final-title-social-links
