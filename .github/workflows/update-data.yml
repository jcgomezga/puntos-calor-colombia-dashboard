name: Actualizar datos IDEAM

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de actualización
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - backfill
  push:
    branches: [main]
    paths:
      - "scripts/update_ideam_data.py"
      - "config/data-policy.json"
      - "tests_py/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: ideam-data-update
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar contrato de datos
        run: python -m unittest discover -s tests_py -p "test_*.py" -v
      - name: Determinar modo
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=backfill" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=refresh" >> "$GITHUB_OUTPUT"
          fi
      - name: Descargar y procesar
        run: python scripts/update_ideam_data.py --mode "${{ steps.mode.outputs.value }}" --workers 4 --timeout 30 --attempts 2 --transport curl
      - name: Guardar resultados versionados
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No hay cambios de datos para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: actualizar históricos IDEAM"
          git pull --rebase origin main
          git push origin main
