name: Actualizar datos IDEAM

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de actualización
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - backfill
  push:
    branches: [main]
    paths:
      - "scripts/update_ideam_data.py"
      - "scripts/territorialize_hotspots.py"
      - "scripts/enrich_protected_areas.py"
      - "scripts/enrich_land_cover.py"
      - "scripts/enrich_mining_titles.py"
      - "scripts/enrich_anla_projects.py"
      - "scripts/enrich_anh_contracts.py"
      - "scripts/build_historical_summaries.py"
      - "scripts/build_operational_episodes.py"
      - "requirements-data.txt"
      - "config/data-policy.json"
      - "tests_py/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: ideam-data-update
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias geoespaciales
        run: python -m pip install --requirement requirements-data.txt
      - name: Probar contrato de datos
        run: python -m unittest discover -s tests_py -p "test_*.py" -v
      - name: Determinar modo
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=backfill" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=refresh" >> "$GITHUB_OUTPUT"
          fi
      - name: Validar cadena TLS del IDEAM
        shell: bash
        run: |
          python scripts/prepare_ideam_ca.py --output "$RUNNER_TEMP/ideam-ca-bundle.pem"
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/ideam-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Descargar y procesar
        run: python scripts/update_ideam_data.py --mode "${{ steps.mode.outputs.value }}" --workers 4 --timeout 30 --attempts 2 --transport curl
      - name: Territorializar y construir datos del dashboard
        run: python scripts/territorialize_hotspots.py --workers 4 --batch-size 25
      - name: Relacionar con áreas protegidas RUNAP
        run: python scripts/enrich_protected_areas.py --workers 4 --batch-size 100
      - name: Asignar cobertura de la tierra IDEAM 2024
        run: python scripts/enrich_land_cover.py --workers 6 --batch-size 100
      - name: Relacionar con títulos mineros vigentes ANM
        run: python scripts/enrich_mining_titles.py --workers 6 --batch-size 200 --max-cache-hours 24
      - name: Relacionar con proyectos ANLA
        run: python scripts/enrich_anla_projects.py --workers 5 --batch-size 100 --max-cache-hours 24
      - name: Relacionar con áreas contractuales asignadas ANH
        run: python scripts/enrich_anh_contracts.py --workers 5 --batch-size 100 --max-cache-hours 24
      - name: Construir episodios espacio-temporales preliminares
        run: python scripts/build_operational_episodes.py
      - name: Construir resúmenes históricos
        run: python scripts/build_historical_summaries.py --history-start 2026-07-01
      - name: Guardar resultados versionados
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data public/data)" ]]; then
            echo "No hay cambios de datos para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git commit -m "data: actualizar históricos IDEAM y DANE"
          git pull --rebase origin main
          git push origin main
