name: MB-05 aplicar accesibilidad y responsive

on:
  push:
    branches: [fix/accessibility-responsive-non-map]
    paths:
      - ".github/workflows/mb05-apply-a11y-responsive.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accessibility-responsive-non-map
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar cambios no cartográficos de MB-05
        run: node scripts/mb05-apply-a11y-responsive.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No hubo cambios que guardar."
            exit 0
          fi
          git commit -m "a11y: mejorar semántica contraste y responsive"
          git pull --rebase origin fix/accessibility-responsive-non-map
          git push origin HEAD:fix/accessibility-responsive-non-map