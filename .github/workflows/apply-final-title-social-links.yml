name: Aplicar título y redes sociales

on:
  push:
    branches: [feat/final-title-social-links]
    paths:
      - ".github/workflows/apply-final-title-social-links.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/final-title-social-links
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar cambios
        run: node scripts/apply-final-title-social-links.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/layout.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No hubo cambios que guardar."
            exit 0
          fi
          git commit -m "ui: actualizar título y añadir redes sociales"
          git push origin HEAD:feat/final-title-social-links
