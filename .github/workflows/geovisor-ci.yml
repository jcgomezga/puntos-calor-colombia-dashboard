name: Validar geovisor

on:
  push:
    branches: [feature/geovisor-fase-8a]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geovisor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditar dependencias productivas (gate bloqueante)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Probar build Vite/Vinext y pruebas web
        run: env -u GITHUB_ACTIONS npm test
      - name: Probar exportación GitHub Pages
        run: npm run build:pages
      - name: Medir presupuesto JavaScript de Pages
        run: node scripts/check-pages-bundle-budget.mjs
      - name: Verificar activos publicables del geovisor
        run: |
          test -f public/maplibre/maplibre-gl-worker.mjs
          test -f public/maplibre/maplibre-gl-shared.mjs
          test -f out/maplibre/maplibre-gl-worker.mjs
          test -f out/maplibre/maplibre-gl-shared.mjs
          test -f public/data/context-details/manifest.json
          test -f out/data/context-details/manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          for (const path of ["public/data/context-details/manifest.json", "out/data/context-details/manifest.json"]) {
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            if (manifest.shardCount !== 128) throw new Error(`${path}: shardCount inesperado`);
            if (manifest.recordCount < 22_847) throw new Error(`${path}: faltan fichas territoriales`);
            if (manifest.maxShardBytes >= 500_000) throw new Error(`${path}: fragmento demasiado grande (${manifest.maxShardBytes} bytes`);
            console.log(`${path}: ${manifest.recordCount} fichas, ${manifest.writtenShards} fragmentos, máximo ${manifest.maxShardBytes} bytes`);
          }
          NODE