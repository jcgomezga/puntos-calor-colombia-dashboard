name: MB-09A diagnóstico WebGL2

on:
  push:
    branches: [audit/mb09a-cartography-diagnosis]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mb09a-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir exportación Pages
        run: npm run build:pages
      - name: Probar WebGL2/MapLibre con SwiftShader
        run: node scripts/mb09a-webgl-diagnostic.mjs
      - name: Medir servicio vectorial IDEAM
        if: always()
        run: node scripts/mb09a-ideam-latency.mjs
      - name: Publicar capturas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mb09a-webgl-diagnostic
          path: artifacts/mb09a
          if-no-files-found: warn
          retention-days: 7
