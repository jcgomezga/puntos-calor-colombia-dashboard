name: MB-04 separar workspace cartográfico

on:
  push:
    branches: [fix/frontend-performance-stability]
    paths:
      - ".github/workflows/mb04-refactor-map-workspace.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-performance-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extraer cartografía pesada del chunk principal
        run: node scripts/mb04-refactor-map-workspace.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No hubo cambios que guardar."
            exit 0
          fi
          git commit -m "perf: diferir workspace cartográfico"
          git pull --rebase origin fix/frontend-performance-stability
          git push origin HEAD:fix/frontend-performance-stability
