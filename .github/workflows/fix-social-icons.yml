name: Aplicar iconos sociales internos

on:
  push:
    branches: [feat/final-title-social-links]
    paths:
      - ".github/workflows/fix-social-icons.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/final-title-social-links
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fix-social-icons.mjs
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: usar SVG internos para redes sociales"
          git push origin HEAD:feat/final-title-social-links
