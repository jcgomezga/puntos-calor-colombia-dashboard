name: MB-03 actualizar dependencias seguras

on:
  push:
    branches: [fix/qa-security-gates]
    paths:
      - ".github/workflows/mb03-refresh-dependencies.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa-security-gates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Alinear Next.js y su configuración ESLint
        run: |
          npm install --save-exact next@16.3.4
          npm install --save-dev --save-exact eslint-config-next@16.3.4
      - name: Aplicar correcciones compatibles de npm audit
        run: npm audit fix --omit=dev
      - name: Verificar auditoría productiva
        run: npm audit --omit=dev --audit-level=high
      - name: Guardar package y lockfile si cambiaron
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No hay cambios de dependencias que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: alinear Next.js y dependencias corregidas"
          git pull --rebase origin fix/qa-security-gates
          git push origin HEAD:fix/qa-security-gates
