name: Migrar interfaz operacional de episodios

on:
  push:
    branches: [feature/geovisor-fase-8a]
    paths:
      - scripts/migrate_operational_episode_ui.py
      - .github/workflows/migrate-operational-episode-ui.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geovisor-fase-8a
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar migración verificable
        run: python scripts/migrate_operational_episode_ui.py
      - name: Verificar ausencia del selector A-B
        run: |
          ! grep -q 'Escenario de sensores' app/page.tsx
          ! grep -q 'setScenario' app/page.tsx
          grep -q 'Episodios de detecciones térmicas' app/page.tsx
          grep -q '1 km · 24 h · ≥3' app/page.tsx
      - name: Confirmar y publicar la migración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No hay cambios por confirmar"
          else
            git commit -m "feat: adoptar episodios como unidad pública operacional"
            git push origin HEAD:feature/geovisor-fase-8a
          fi
