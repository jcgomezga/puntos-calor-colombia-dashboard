name: Aplicar afinación de etiquetas

on:
  push:
    branches: [feature/geovisor-fase-8a]
    paths:
      - scripts/tune_label_hierarchy.mjs
      - .github/workflows/apply-label-tuning.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geovisor-fase-8a
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Afinar jerarquía de etiquetas
        run: node scripts/tune_label_hierarchy.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/geovisor-map.tsx tests/geovisor-config.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: afinar jerarquía de etiquetas territoriales"
          git push origin HEAD:feature/geovisor-fase-8a
