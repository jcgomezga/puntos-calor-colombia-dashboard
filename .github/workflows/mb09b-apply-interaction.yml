name: MB-09B aplicar interacción

on:
  push:
    branches: [fix/mb09-geovisor-cartography-accessibility]
    paths:
      - ".github/workflows/mb09b-apply-interaction.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mb09-geovisor-cartography-accessibility
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Aplicar correcciones MAP-001/003/004
        run: node scripts/mb09b-apply-interaction.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/public-detection-geovisor-map.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No hubo cambios que guardar."
            exit 0
          fi
          git commit -m "fix: hacer explícita la prioridad de consulta cartográfica"
          git pull --rebase origin fix/mb09-geovisor-cartography-accessibility
          git push origin HEAD:fix/mb09-geovisor-cartography-accessibility